<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EBU STORE | Secure Business Management Access</title>
    
    <meta name="description" content="Secure login for EBU STORE Management System. Access your business dashboard, inventory, and sales reports.">
    <meta name="robots" content="noindex, nofollow"> <!-- Prevent login page indexing for security, but allow metadata for previews -->
    
    <link rel="icon" href="images/logo.jpg" type="image/jpeg">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed', err));
            });
        }
    </script>
    <style>
        body.login-page {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Outfit', 'Inter', sans-serif;
            padding: 40px 20px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating Background Elements */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            z-index: 0;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(10deg); }
            66% { transform: translate(-20px, 20px) rotate(-10deg); }
        }

        .login-container {
            width: 100%;
            max-width: 950px;
            position: relative;
            z-index: 10;
            animation: cardEntrance 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
            display: flex;
            min-height: 600px;
            overflow: hidden;
            background-clip: padding-box;
        }

        .login-sidebar {
            flex: 1;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            animation: sideEntrance 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes sideEntrance {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .login-main {
            flex: 1.3;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
            animation: mainEntrance 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes mainEntrance {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Form Switching Logic with Enhanced Animation */
        .auth-forms {
            position: relative;
            width: 100%;
            min-height: 450px;
        }

        .login-form-container, .register-form-container {
            transition: all 0.6s cubic-bezier(0.6, 0.05, 0.1, 0.99);
            width: 100%;
            background: white;
            padding-bottom: 20px;
        }

        .register-form-container {
            position: absolute;
            top: 0;
            left: 100%;
            opacity: 0;
            visibility: hidden;
            z-index: 1;
            transform: scale(0.9);
        }

        .show-register .login-form-container {
            transform: translateX(-100%) scale(0.9);
            opacity: 0;
            visibility: hidden;
        }

        .show-register .register-form-container {
            left: 0;
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .login-logo {
            width: 140px;
            height: 140px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .business-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
            line-height: 1.2;
        }

        .login-main h2 {
            color: #1e3a8a;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .login-main p {
            color: #64748b;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .login-input {
            width: 100%;
            height: 56px;
            padding: 0 20px 0 54px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            color: #1e293b;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .login-input:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .login-input:focus + i {
            color: #2563eb;
        }

        .login-btn {
            width: 100%;
            height: 56px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .login-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .login-footer a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 700;
        }

        /* Form Switching Logic */
        .auth-forms {
            position: relative;
            width: 100%;
            min-height: 450px; /* Ample space for all form elements */
        }

        .login-form-container, .register-form-container {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            background: white;
            padding-bottom: 20px;
        }

        .register-form-container {
            position: absolute;
            top: 0;
            left: 100%;
            opacity: 0;
            visibility: hidden;
            z-index: 1;
        }

        .show-register .login-form-container {
            transform: translateX(-100%);
            opacity: 0;
            visibility: hidden;
        }

        .show-register .register-form-container {
            left: 0;
            opacity: 1;
            visibility: visible;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h2 {
            color: #1e3a8a;
            font-size: 28px;
            font-weight: 800;
            margin: 0;
        }

        .form-header p {
            color: #64748b;
            margin: 5px 0 0 0;
            font-size: 14px;
        }
    </style>
</head>
<body class="login-page">
    <!-- Animated Background Elements -->
    <div class="bg-element" style="width: 400px; height: 400px; top: -150px; left: -150px; opacity: 0.07;"></div>
    <div class="bg-element" style="width: 300px; height: 300px; bottom: -100px; right: -50px; opacity: 0.05; animation-delay: -5s;"></div>
    <div class="bg-element" style="width: 200px; height: 200px; top: 20%; right: 10%; opacity: 0.03; animation-delay: -10s;"></div>
    
    <div class="login-container">
        <div class="login-card" id="authCard">
            <!-- Left Side: Branding -->
            <div class="login-sidebar">
                <div class="login-logo">
                    <img src="images/logo.jpg" alt="EBU Store Logo">
                </div>
                <h2 class="business-title">EBU STORE</h2>
                <p style="color: rgba(255,255,255,0.7); margin-top: 10px;">Professional Management System</p>
            </div>

            <!-- Right Side: Forms -->
            <div class="login-main">
                <div class="auth-forms">
                    <!-- Login Form -->
                    <div class="login-form-container">
                        <div class="form-header">
                            <h2>Welcome Back</h2>
                            <p>Please enter your details to sign in.</p>
                        </div>
                        
                        <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
                            <div class="form-group">
                                <input type="text" id="loginEmail" class="login-input" placeholder="Email or Username" autocomplete="off" required>
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="form-group">
                                <input type="password" id="loginPass" class="login-input" placeholder="Password" autocomplete="new-password" required>
                                <i class="fas fa-lock"></i>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px; margin: -10px 0 20px 5px; color: #64748b; font-size: 14px;">
                                <input type="checkbox" id="rememberMe" style="width: 16px; height: 16px; cursor: pointer;">
                                <label for="rememberMe" style="margin: 0; cursor: pointer; user-select: none;">Remember Me</label>
                            </div>
                            <button type="submit" class="login-btn">
                                <span>Sign In</span>
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </form>
                        
                        <div class="login-footer">
                            Don't have an account? 
                            <a href="#" onclick="toggleAuth(true)">Create Account</a>
                        </div>
                    </div>

                    <!-- Register Form -->
                    <div class="register-form-container">
                        <div class="form-header">
                            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
                                <a href="#" onclick="toggleAuth(false)" style="color: #1e3a8a; font-size: 20px; transition: transform 0.3s;" onmouseover="this.style.transform='translateX(-5px)'" onmouseout="this.style.transform='translateX(0)'">
                                    <i class="fas fa-arrow-left"></i>
                                </a>
                                <h2 style="margin: 0;">Create Account</h2>
                            </div>
                            <p>Join the EBU Store management system.</p>
                        </div>
                        
                        <form id="registerForm" onsubmit="handleRegister(event)" style="padding-bottom: 20px;">
                            <div class="form-group">
                                <input type="text" id="regName" class="login-input" placeholder="Full Name" required>
                                <i class="fas fa-id-card"></i>
                            </div>
                            <div class="form-group">
                                <input type="email" id="regEmail" class="login-input" placeholder="Email Address" required>
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="form-group">
                                <input type="text" id="regUser" class="login-input" placeholder="Desired Username" required>
                                <i class="fas fa-user-plus"></i>
                            </div>
                            <div class="form-group">
                                <input type="password" id="regPass" class="login-input" placeholder="Security Password" required>
                                <i class="fas fa-shield-alt"></i>
                            </div>
                            <button type="submit" class="login-btn" style="margin-top: 5px;">
                                <span>Submit for Approval</span>
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                        
                        <div class="login-footer" style="margin-top: 10px;">
                            Already have an account? 
                            <a href="#" onclick="toggleAuth(false)">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://ebu-store-system-production.up.railway.app';

        function toggleAuth(showRegister) {
            const card = document.getElementById('authCard');
            if (showRegister) {
                card.classList.add('show-register');
            } else {
                card.classList.remove('show-register');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value;

            const btn = e.target.querySelector('.login-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, username, password })
                });
                const result = await response.json();
                
                if (result.success) {
                    alert('Registration Successful! Please wait for Admin approval.');
                    toggleAuth(false);
                    e.target.reset();
                } else {
                    alert('Registration Failed: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Connection Error: Could not connect to backend server.');
            } finally {
                btn.innerHTML = '<span>Submit for Approval</span> <i class="fas fa-paper-plane"></i>';
                btn.disabled = false;
            }
        }

        async function handleLogin(event) {
            if (event) event.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            const btn = document.querySelector('.login-form-container .login-btn');

            if (btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
                btn.disabled = true;
            }

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('ebu_current_user', JSON.stringify(result.user));
                    localStorage.setItem('ebu_token', result.token);
                    window.location.href = "index.html";
                } else {
                    alert('Login Failed: ' + (result.error || 'Invalid credentials'));
                }
            } catch (err) {
                alert('Connection Error: Could not connect to backend server.');
            } finally {
                if (btn) {
                    btn.innerHTML = '<span>Sign In</span> <i class="fas fa-arrow-right"></i>';
                    btn.disabled = false;
                }
            }

            return false;
        }
    </script>
</body>
</html>
